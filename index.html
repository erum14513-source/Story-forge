<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Forge</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1.2rem; background: #f4f4f8; color: #222; line-height: 1.5; }
    h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
    .sub { color: #666; font-size: 0.95rem; margin: 0 0 1.5rem; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
    textarea, input { width: 100%; padding: 0.75rem; margin-bottom: 1.2rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { background: #6b4eff; color: #fff; border: none; padding: 0.9rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    button:disabled { opacity: 0.55; }
    #status { margin-top: 1rem; font-size: 0.9rem; color: #666; }
    #output { background: #fff; padding: 1.2rem; border-radius: 8px; margin-top: 1rem; white-space: pre-wrap; line-height: 1.65; border: 1px solid #ddd; display: none; }
  </style>
</head>
<body>
  <h1>📖 Story Forge</h1>
  <p class="sub">Write a chapter of at least 1,500 words from your story idea.</p>

  <label>Main Story Description</label>
  <textarea id="mainDesc" rows="4" placeholder="e.g. A young archaeologist discovers a hidden civilization..."></textarea>

  <label>Chapter Prompt (optional)</label>
  <input id="chapterPrompt" type="text" placeholder="e.g. She finds a mysterious artifact">

  <button id="btn" onclick="generateStory()">Generate Chapter (1,500+ words)</button>
  
  <div id="status"></div>
  <div id="output"></div>

  <script>
    async function generateStory() {
      const main = document.getElementById('mainDesc').value.trim();
      const chapter = document.getElementById('chapterPrompt').value.trim();
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const output = document.getElementById('output');

      if (!main) { alert('Please enter a main story description.'); return; }

      btn.disabled = true;
      btn.textContent = 'Generating... (30-60 seconds)';
      status.textContent = 'Writing your chapter. Please wait...';
      output.style.display = 'none';

      let prompt = `Write a highly detailed story chapter of at least 1500 words based on this: "${main}".`;
      if (chapter) prompt += ` Focus on this for the chapter: "${chapter}".`;
      prompt += " Make it engaging.";

      try {
        // This free API requires no key and works directly from the browser!
        const response = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt));
        
        if (!response.ok) throw new Error('Network response was not ok');
        
        const story = await response.text();
        
        output.textContent = story;
        output.style.display = 'block';
        status.textContent = '';
      } catch (error) {
        status.textContent = '❌ Error: ' + error.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Chapter (1,500+ words)';
      }
    }
  </script>
</body>
</html>
