<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Forge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.2rem;
      background: #f4f4f8;
      color: #222;
      line-height: 1.5;
    }
    h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
    .sub { color: #666; font-size: 0.95rem; margin: 0 0 1.5rem; }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }
    .hint { font-weight: 400; color: #888; }
    textarea, input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 100px; }
    textarea:focus, input:focus {
      outline: none;
      border-color: #6b4eff;
      box-shadow: 0 0 0 3px rgba(107, 78, 255, 0.15);
    }
    button {
      background: #6b4eff;
      color: #fff;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { background: #5638e0; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
      min-height: 1.2em;
    }
    #output {
      background: #fff;
      padding: 1.2rem;
      border-radius: 8px;
      margin-top: 1rem;
      white-space: pre-wrap;
      line-height: 1.65;
      border: 1px solid #ddd;
      font-size: 1rem;
    }
    #output:empty { display: none; }
    .meta {
      font-size: 0.85rem;
      color: #2a9d4a;
      margin-top: 0.6rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>📖 Story Forge</h1>
  <p class="sub">Write a chapter of at least 1,500 words from your story idea.</p>

  <label for="mainDesc">Main Story Description</label>
  <textarea id="mainDesc" rows="4" placeholder="e.g. A young archaeologist discovers a hidden civilization beneath the Sahara Desert..."></textarea>

  <label for="chapterPrompt">Chapter Prompt <span class="hint">(optional)</span></label>
  <input id="chapterPrompt" type="text" placeholder="e.g. She finds a mysterious artifact in the ruins">

  <button id="generateBtn">Generate Chapter (1,500+ words)</button>

  <div id="status"></div>
  <div id="output"></div>
  <div id="wordCount" class="meta"></div>

  <script>
    const btn = document.getElementById('generateBtn');
    const mainDesc = document.getElementById('mainDesc');
    const chapterPrompt = document.getElementById('chapterPrompt');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const wordCount = document.getElementById('wordCount');

    const API_URL = '/api/generate';

    btn.addEventListener('click', async () => {
      const main = mainDesc.value.trim();
      if (!main) {
        status.textContent = '⚠️ Please enter a main story description first.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating… (30–90 seconds)';
      status.textContent = 'Writing your chapter. Keep this tab open.';
      output.textContent = '';
      wordCount.textContent = '';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mainDescription: main,
            chapterPrompt: chapterPrompt.value.trim() || undefined
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        output.textContent = data.story;
        const words = data.story.trim().split(/\s+/).length;
        wordCount.textContent = '✅ ' + words + ' words generated';
        status.textContent = '';
      } catch (err) {
        status.textContent = '';
        output.textContent = '❌ Error: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Chapter (1,500+ words)';
      }
    });
  </script>

</body>
</html>
